name: Deploy Apps Script backend

# Runs on every push to main that touches the backend script or its manifest.
# The frontend (annotator/index.html) deploys via Netlify on its own — see
# netlify.toml.
#
# Why this workflow looks the way it does:
#   1. clasp 3.x splits the old `deploy` command into `create-deployment` and
#      `redeploy`. We use `redeploy` and pass the existing deployment ID so
#      the /exec URL stays stable — no broken bookmarks for annotators.
#   2. We create the version EXPLICITLY (clasp version) and pass that number
#      to redeploy via -V. Letting clasp infer the version is the root cause
#      of duplicate deployments under clasp issue #63 — even with --deploymentId
#      set, the inferred-version path can silently shadow into a fresh
#      deployment. Explicit -V eliminates this.
#   3. The manifest guard runs FIRST. The web app's "Anyone" access setting
#      lives in annotator/appsscript.json and travels with the version. If a
#      careless edit drops the webapp.access field, every redeploy from then on
#      reverts the live deployment to "Only myself" — silently — and we'd lose
#      access on phones until someone notices and fixes it via the UI. The
#      guard fails the build before any of that can happen.

on:
  push:
    branches: [main]
    paths:
      - 'annotator/google_apps_script.gs'
      - 'annotator/appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # also allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether backend auto-deploy is configured
        # The workflow only runs the actual deploy if both required secrets
        # are set. If they aren't (e.g. project hasn't completed the Apps
        # Script setup yet), the workflow exits cleanly with a notice
        # instead of failing — so first-push commits show a green check
        # rather than a red X. Set both secrets per DEPLOY.md to activate.
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::Backend auto-deploy skipped: clasp secrets are not configured yet. See DEPLOY.md → 'Wire up GitHub Actions' to enable. This is expected before the Apps Script project is set up."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Check out the repo
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Guard the web app access setting
        # The "Anyone" access setting persists across redeploys ONLY because
        # the manifest declares it. If someone edits annotator/appsscript.json
        # and drops the webapp.access field, the next redeploy will silently
        # revert the live deployment to "Only myself" and the annotator URL
        # will stop working on phones. Catch that here, before deploy.
        if: steps.check.outputs.configured == 'true'
        run: |
          python3 - <<'PY'
          import json, sys
          with open('annotator/appsscript.json') as f:
              manifest = json.load(f)
          webapp = manifest.get('webapp') or {}
          access = webapp.get('access')
          execute_as = webapp.get('executeAs')
          problems = []
          if access != 'ANYONE':
              problems.append(f'webapp.access must be "ANYONE", got {access!r}')
          if execute_as != 'USER_DEPLOYING':
              problems.append(f'webapp.executeAs must be "USER_DEPLOYING", got {execute_as!r}')
          if problems:
              for p in problems:
                  print(f'::error file=annotator/appsscript.json::{p}')
              sys.exit(1)
          print('Manifest guard OK: webapp.access=ANYONE, executeAs=USER_DEPLOYING')
          PY

      - name: Set up Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp 3.3.0
        # Pinned. clasp 3.x split `deploy` into create-deployment / redeploy
        # and expects explicit -V on redeploys (see workflow header comment).
        # Don't bump to "latest" without re-verifying the redeploy contract;
        # see clasp issue #63.
        if: steps.check.outputs.configured == 'true'
        run: npm install -g @google/clasp@3.3.0

      - name: Restore clasp credentials
        # CLASPRC_JSON is the entire contents of ~/.clasprc.json from your
        # local machine after `clasp login`. See DEPLOY.md for how to set
        # this secret. The OAuth client behind these credentials must be in
        # "In production" publishing status (not "Testing") — otherwise the
        # refresh token expires every 7 days and CI starts failing.
        if: steps.check.outputs.configured == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Verify clasp can see the project
        if: steps.check.outputs.configured == 'true'
        run: clasp status

      - name: Push code to Apps Script
        if: steps.check.outputs.configured == 'true'
        run: clasp push --force

      - name: Create a new versioned snapshot
        # clasp version prints something like "Created version 12." We grep
        # the trailing integer out and pass it to redeploy. Doing this
        # explicitly (rather than letting redeploy auto-create) is what keeps
        # the deployment ID stable.
        id: version
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          OUTPUT=$(clasp version "ci ${GITHUB_SHA::7}")
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oE '[0-9]+' | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version number from clasp output"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Created version $VERSION"

      - name: Redeploy (update the existing deployment, keep the URL)
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          clasp redeploy "$DEPLOYMENT_ID" \
            -V "$VERSION" \
            -d "ci $(date -u +%Y-%m-%dT%H:%MZ) ${GITHUB_SHA::7}"

      - name: Probe live deployment access (must serve "Anyone")
        # Apps Script's `clasp redeploy` empirically resets a deployment's
        # "Who has access" setting to something other than "Anyone" on some
        # project states, despite the manifest declaring access: ANYONE.
        # When this happens, the live /exec URL returns 401 (no CORS headers)
        # and the browser annotator silently fails on every fetch.
        #
        # We probe the live URL with an unauthenticated GET. If it doesn't
        # return JSON, fail the build immediately with a clear remediation
        # so the operator knows to flip access in Manage Deployments before
        # the annotator tries to use the broken deployment.
        #
        # The probe URL is the optional WEB_APP_URL secret. If not configured,
        # skip with a notice — the probe is best-effort and only runs when the
        # operator has wired the URL up.
        if: steps.check.outputs.configured == 'true'
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          if [ -z "$WEB_APP_URL" ]; then
            echo "::notice::Post-deploy probe skipped: WEB_APP_URL secret not set. Add it to enable automatic detection of access-setting reversion. See DEPLOY.md."
            exit 0
          fi
          echo "Probing $WEB_APP_URL?text=__probe__ ..."
          # -L follow redirects, -s silent, -o capture body, -w get status code.
          STATUS=$(curl -L -s -o /tmp/probe_body -w '%{http_code}' "$WEB_APP_URL?text=__probe__")
          HEAD_BYTES=$(head -c 80 /tmp/probe_body | tr -d '\0')
          echo "HTTP status: $STATUS"
          echo "First 80 bytes of body: $HEAD_BYTES"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live deployment returned HTTP $STATUS instead of 200. Likely the 'Who has access' setting reverted to non-Anyone. Open the Apps Script editor → Deploy → Manage deployments → edit the active deployment → Who has access: Anyone → Deploy. Then re-run this workflow."
            exit 1
          fi
          # 200 alone isn't enough — a sign-in page is also 200. Check for JSON.
          if ! head -c 80 /tmp/probe_body | grep -q '^[[:space:]]*[{[]'; then
            echo "::error::Live deployment returned 200 but the body is not JSON (likely a sign-in HTML page). The deployment access setting is probably 'Anyone with Google account' instead of 'Anyone'. Open the Apps Script editor → Deploy → Manage deployments → edit → Who has access: Anyone → Deploy. Then re-run this workflow."
            exit 1
          fi
          echo "Live deployment probe OK: returned JSON response."
