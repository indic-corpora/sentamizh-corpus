name: Deploy Apps Script backend

# Runs on every push to main that touches the backend script or its manifest.
# The frontend (annotator/index.html) deploys via Netlify on its own — see
# netlify.toml.

on:
  push:
    branches: [main]
    paths:
      - 'annotator/google_apps_script.gs'
      - 'annotator/appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # also allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Restore clasp credentials
        # CLASPRC_JSON is the entire contents of ~/.clasprc.json from your
        # local machine after `clasp login`. See DEPLOY.md for how to set
        # this secret.
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set. Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Verify clasp can see the project
        run: clasp status

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Deploy (update existing deployment so URL stays the same)
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::APPS_SCRIPT_DEPLOYMENT_ID secret is not set. See DEPLOY.md."
            exit 1
          fi
          clasp deploy \
            --deploymentId "$DEPLOYMENT_ID" \
            --description "GHA $(date -u +%Y-%m-%dT%H:%MZ) ${GITHUB_SHA::7}"
